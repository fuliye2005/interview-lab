name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Package Windows installers
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "src-tauri/target/release/bundle/msi/*.msi", "src-tauri/target/release/bundle/nsis/*.exe" `
            -DestinationPath "interview-lab-windows-installers.zip"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: interview-lab-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            interview-lab-windows-installers.zip
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            (Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File).FullName,
            (Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File).FullName,
            (Resolve-Path "interview-lab-windows-installers.zip").Path
          )
          gh release create "${{ github.ref_name }}" $assets `
            --title "Interview Lab ${{ github.ref_name }} - Windows" `
            --notes "简体中文 Windows 安装包，支持 ASR 和手动文本测试。" `
            --latest
